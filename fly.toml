# Fly.io config for the AMP relayer.
# Deploy:  fly deploy   (from the repo root)
# Region iad = US East (near Neon's us-east-2 Postgres + Fuji RPC).
#
# Set secrets after first deploy:
#   flyctl secrets set DATABASE_URL="postgresql://..." AMP_RELAYER_KEY="0x..."

app = "amp-relayer"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# No HTTP service — the relayer polls Postgres, serves no public endpoints.
[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
