# cargo-deny — supply-chain policy for the AMP relayer workspace.
[graph]
# Only check the host platform (CI runs on ubuntu-latest).
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

[advisories]
# Fail on any RUSTSEC advisory not explicitly ignored.
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"

[licenses]
# Allow common permissive licenses.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]

[bans]
# Warn on duplicate versions (don't fail — common in transitive deps).
multiple-versions = "warn"
